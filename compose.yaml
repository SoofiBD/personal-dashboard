services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: >-
      sh -c 'rm -f tmp/pids/server.pid;
      ./bin/rails db:prepare && exec ./bin/rails server -b 0.0.0.0'
    volumes:
      - .:/rails
      - bundle_cache:/usr/local/bundle
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - .env.local
    environment:
      RAILS_ENV: development
      POSTGRES_DB: "${POSTGRES_DB:?Set POSTGRES_DB via --env-file .env.local}"
      POSTGRES_USER: "${POSTGRES_USER:?Set POSTGRES_USER via --env-file .env.local}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD via --env-file .env.local}"
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}"
      PDF_WORKER_URL: "http://pdf-worker:8000"
    depends_on:
      db:
        condition: service_healthy
      pdf-worker:
        condition: service_healthy

  jobs:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: >-
      sh -c './bin/rails db:prepare && exec ./bin/jobs'
    volumes:
      - .:/rails
      - bundle_cache:/usr/local/bundle
    env_file:
      - .env.local
    environment:
      RAILS_ENV: development
      POSTGRES_DB: "${POSTGRES_DB:?Set POSTGRES_DB via --env-file .env.local}"
      POSTGRES_USER: "${POSTGRES_USER:?Set POSTGRES_USER via --env-file .env.local}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD via --env-file .env.local}"
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}"
      PDF_WORKER_URL: "http://pdf-worker:8000"
    depends_on:
      db:
        condition: service_healthy
      web:
        condition: service_started

  pdf-worker:
    build:
      context: ./pdf_worker
    volumes:
      - ./pdf_worker:/app
    expose:
      - "8000"
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 768m
    cpus: 1.0
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  db:
    image: postgres:16-alpine
    env_file:
      - .env.local
    environment:
      POSTGRES_DB: "${POSTGRES_DB:?Set POSTGRES_DB via --env-file .env.local}"
      POSTGRES_USER: "${POSTGRES_USER:?Set POSTGRES_USER via --env-file .env.local}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD via --env-file .env.local}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  bundle_cache:
  postgres_data:
