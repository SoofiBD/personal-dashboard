services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: >-
      sh -c 'export DATABASE_URL=postgresql://$$POSTGRES_USER:$$POSTGRES_PASSWORD@db:5432/$$POSTGRES_DB;
      rm -f tmp/pids/server.pid;
      ./bin/rails db:prepare && exec ./bin/rails server -b 0.0.0.0'
    volumes:
      - .:/rails
      - bundle_cache:/usr/local/bundle
    ports:
      - "3000:3000"
    env_file:
      - .env.local
    environment:
      RAILS_ENV: development
      POSTGRES_DB: "${POSTGRES_DB:-personal_dashboard_development}"
      POSTGRES_USER: "${POSTGRES_USER:-personal_dashboard}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-local-development-password}"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    env_file:
      - .env.local
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-personal_dashboard_development}"
      POSTGRES_USER: "${POSTGRES_USER:-personal_dashboard}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-local-development-password}"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  bundle_cache:
  postgres_data:
