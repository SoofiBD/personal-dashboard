services:
  nas-worker:
    extends:
      file: compose.nas.yaml
      service: nas-worker

  web:
    image: personal-dashboard-web
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: >-
      sh -c 'rm -f tmp/pids/server.pid;
      ./bin/rails db:prepare && exec ./bin/rails server -b 0.0.0.0'
    volumes:
      - .:/rails
      - bundle_cache:/usr/local/bundle
      - storage_data:/rails/storage
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "ruby", "-rnet/http", "-e", "exit(Net::HTTP.get_response(URI('http://127.0.0.1:3000/up')).code == '200' ? 0 : 1)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
      start_interval: 2s
    env_file:
      - .env.local
    environment:
      RAILS_ENV: development
      POSTGRES_DB: "${POSTGRES_DB:?Set POSTGRES_DB via --env-file .env.local}"
      POSTGRES_USER: "${POSTGRES_USER:?Set POSTGRES_USER via --env-file .env.local}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD via --env-file .env.local}"
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}"
      TEST_DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${TEST_POSTGRES_DB:-personal_dashboard_test}"
      PDF_WORKER_URL: "http://pdf-worker:8000"
      JAN_API_BASE_URL: "${JAN_API_BASE_URL:-http://host.docker.internal:1337}"
      STIRLING_PDF_STATUS_URL: "http://stirling-pdf:8080/pdf-editor/api/v1/info/status"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [default, nas]
    depends_on:
      db:
        condition: service_healthy
      pdf-worker:
        condition: service_started

  jobs:
    image: personal-dashboard-web
    command: ./bin/jobs
    volumes:
      - .:/rails
      - bundle_cache:/usr/local/bundle
      - storage_data:/rails/storage
    env_file:
      - .env.local
    environment:
      RAILS_ENV: development
      POSTGRES_DB: "${POSTGRES_DB:?Set POSTGRES_DB via --env-file .env.local}"
      POSTGRES_USER: "${POSTGRES_USER:?Set POSTGRES_USER via --env-file .env.local}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD via --env-file .env.local}"
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}"
      TEST_DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${TEST_POSTGRES_DB:-personal_dashboard_test}"
      PDF_WORKER_URL: "http://pdf-worker:8000"
      JAN_API_BASE_URL: "${JAN_API_BASE_URL:-http://host.docker.internal:1337}"
      STIRLING_PDF_STATUS_URL: "http://stirling-pdf:8080/pdf-editor/api/v1/info/status"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      web:
        condition: service_healthy

  pdf-worker:
    build:
      context: ./pdf_worker
    volumes:
      - ./pdf_worker:/app
    expose:
      - "8000"
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 768m
    cpus: 1.0
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
      start_interval: 2s

  stirling-pdf:
    image: docker.stirlingpdf.com/stirlingtools/stirling-pdf:2.14.3
    expose:
      - "8080"
    environment:
      SYSTEM_ROOTURIPATH: "/pdf-editor"
      SYSTEM_DEFAULTLOCALE: "tr-TR"
      SYSTEM_MAXFILESIZE: "25"
      SECURITY_ENABLELOGIN: "false"
      DISABLE_ADDITIONAL_FEATURES: "true"
      METRICS_ENABLED: "false"
      SHOW_SURVEY: "false"
    volumes:
      - stirling_config:/configs
      - stirling_tessdata:/usr/share/tessdata
    security_opt:
      - no-new-privileges:true
    mem_limit: 2g
    cpus: 2.0
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/pdf-editor/api/v1/info/status | grep -q 'UP'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
      start_interval: 2s

  chartdb:
    build:
      context: ./modules/chartdb
    expose:
      - "80"
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 1.0
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
      start_interval: 1s
    restart: unless-stopped

  gateway:
    image: caddy:2.8-alpine
    ports:
      - "127.0.0.1:3000:80"
    volumes:
      - ./config/stirling/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
      stirling-pdf:
        condition: service_started
      chartdb:
        condition: service_started

  db:
    image: postgres:16-alpine
    env_file:
      - .env.local
    environment:
      POSTGRES_DB: "${POSTGRES_DB:?Set POSTGRES_DB via --env-file .env.local}"
      POSTGRES_USER: "${POSTGRES_USER:?Set POSTGRES_USER via --env-file .env.local}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD via --env-file .env.local}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  bundle_cache:
  postgres_data:
  stirling_config:
  stirling_tessdata:
  caddy_data:
  caddy_config:
  storage_data:

networks:
  nas:
    internal: true
  nas-egress: {}
