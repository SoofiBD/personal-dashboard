services:
  web:
    image: personal-dashboard:production
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      RAILS_ENV: production
      DATABASE_URL: "${DATABASE_URL:?Set DATABASE_URL in .env.production}"
      DASHBOARD_TIME_ZONE: "${DASHBOARD_TIME_ZONE:-Europe/Istanbul}"
      NAS_WORKER_URL: "${NAS_WORKER_URL:-}"
      NAS_API_TOKEN_FILE: /run/secrets/nas_api_token
      PDF_WORKER_API_KEY_FILE: /run/secrets/pdf_worker_api_key
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "ruby", "-rnet/http", "-e", "exit(Net::HTTP.get_response(URI('http://127.0.0.1:3000/up')).code == '200' ? 0 : 1)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
      start_interval: 2s
    volumes:
      - storage_data:/rails/storage
    read_only: true
    tmpfs:
      - /rails/tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      db:
        condition: service_healthy
      pdf-worker:
        condition: service_started
    restart: unless-stopped
    networks: [edge, database, pdf, stirling, chartdb, nas]
    secrets:
      - rails_master_key
      - nas_api_token
      - pdf_worker_api_key

  jobs:
    image: personal-dashboard:production
    command: ./bin/jobs
    environment:
      RAILS_ENV: production
      DATABASE_URL: "${DATABASE_URL:?Set DATABASE_URL in .env.production}"
      DASHBOARD_TIME_ZONE: "${DASHBOARD_TIME_ZONE:-Europe/Istanbul}"
      PDF_WORKER_API_KEY_FILE: /run/secrets/pdf_worker_api_key
    volumes:
      - storage_data:/rails/storage
    read_only: true
    tmpfs:
      - /rails/tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      db:
        condition: service_healthy
      web:
        condition: service_healthy
      pdf-worker:
        condition: service_healthy
    restart: unless-stopped
    networks: [database, pdf]
    secrets:
      - rails_master_key
      - pdf_worker_api_key

  pdf-worker:
    image: personal-dashboard-pdf-worker:production
    build:
      context: ./pdf_worker
    expose:
      - "8000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 768m
    cpus: 1.0
    environment:
      PDF_WORKER_API_KEY_FILE: /run/secrets/pdf_worker_api_key
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
      start_interval: 2s
    restart: unless-stopped
    networks: [pdf]
    secrets:
      - pdf_worker_api_key

  stirling-pdf:
    image: docker.stirlingtools/stirling-pdf:2.14.3
    expose:
      - "8080"
    environment:
      SYSTEM_ROOTURIPATH: "/pdf-editor"
      SYSTEM_DEFAULTLOCALE: "tr-TR"
      SYSTEM_MAXFILESIZE: "25"
      SECURITY_ENABLELOGIN: "true"
      SECURITY_INITIALLOGIN_USERNAME: "stirling"
      SECURITY_INITIALLOGIN_PASSWORD_FILE: /run/secrets/stirling_pdf_password
      DISABLE_ADDITIONAL_FEATURES: "true"
      METRICS_ENABLED: "false"
      SHOW_SURVEY: "false"
    volumes:
      - stirling_config:/configs
      - stirling_tessdata:/usr/share/tessdata
    security_opt:
      - no-new-privileges:true
    mem_limit: 2g
    cpus: 2.0
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/pdf-editor/api/v1/info/status | grep -q 'UP'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
      start_interval: 2s
    restart: unless-stopped
    networks: [stirling]
    secrets:
      - stirling_pdf_password

  chartdb:
    build:
      context: ./modules/chartdb
    expose:
      - "80"
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 1.0
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
      start_interval: 1s
    restart: unless-stopped
    networks: [chartdb]

  gateway:
    image: caddy:2.8-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      DASHBOARD_DOMAIN: "${DASHBOARD_DOMAIN:?Set DASHBOARD_DOMAIN in .env.production}"
    volumes:
      - ./config/stirling/Caddyfile.production:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
      stirling-pdf:
        condition: service_started
      chartdb:
        condition: service_started
    restart: unless-stopped
    networks: [edge, stirling, chartdb]

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: "${POSTGRES_DB:?Set POSTGRES_DB in .env.production}"
      POSTGRES_USER: "${POSTGRES_USER:?Set POSTGRES_USER in .env.production}"
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks: [database]
    secrets:
      - postgres_password

networks:
  edge: {}
  database:
    internal: true
  pdf:
    internal: true
  stirling:
    internal: true
  chartdb:
    internal: true
  nas:
    internal: true
  nas-egress: {}

volumes:
  postgres_data:
  storage_data:
  stirling_config:
  stirling_tessdata:
  caddy_data:
  caddy_config:

secrets:
  rails_master_key:
    file: ./secrets/rails_master_key.txt
  nas_api_token:
    file: ./secrets/nas_api_token.txt
  pdf_worker_api_key:
    file: ./secrets/pdf_worker_api_key.txt
  stirling_pdf_password:
    file: ./secrets/stirling_pdf_password.txt
  postgres_password:
    file: ./secrets/postgres_password.txt
