services:
  web:
    image: personal-dashboard:production
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      RAILS_ENV: production
      DATABASE_URL: "${DATABASE_URL:?Set DATABASE_URL in .env.production}"
      RAILS_MASTER_KEY: "${RAILS_MASTER_KEY:?Set RAILS_MASTER_KEY in .env.production}"
      DASHBOARD_TIME_ZONE: "${DASHBOARD_TIME_ZONE:-Europe/Istanbul}"
    expose:
      - "3000"
    volumes:
      - storage_data:/rails/storage
    depends_on:
      db:
        condition: service_healthy
      pdf-worker:
        condition: service_healthy
    restart: unless-stopped

  jobs:
    image: personal-dashboard:production
    command: ./bin/jobs
    environment:
      RAILS_ENV: production
      DATABASE_URL: "${DATABASE_URL:?Set DATABASE_URL in .env.production}"
      RAILS_MASTER_KEY: "${RAILS_MASTER_KEY:?Set RAILS_MASTER_KEY in .env.production}"
      DASHBOARD_TIME_ZONE: "${DASHBOARD_TIME_ZONE:-Europe/Istanbul}"
    volumes:
      - storage_data:/rails/storage
    depends_on:
      db:
        condition: service_healthy
      web:
        condition: service_started
      pdf-worker:
        condition: service_healthy
    restart: unless-stopped

  pdf-worker:
    image: personal-dashboard-pdf-worker:production
    build:
      context: ./pdf_worker
    expose:
      - "8000"
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 768m
    cpus: 1.0
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  stirling-pdf:
    image: docker.stirlingpdf.com/stirlingtools/stirling-pdf:2.14.3
    expose:
      - "8080"
    environment:
      SYSTEM_ROOTURIPATH: "/pdf-editor"
      SYSTEM_DEFAULTLOCALE: "tr-TR"
      SYSTEM_MAXFILESIZE: "25"
      SECURITY_ENABLELOGIN: "false"
      DISABLE_ADDITIONAL_FEATURES: "true"
      METRICS_ENABLED: "false"
      SHOW_SURVEY: "false"
    volumes:
      - stirling_config:/configs
      - stirling_tessdata:/usr/share/tessdata
    security_opt:
      - no-new-privileges:true
    mem_limit: 2g
    cpus: 2.0
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/pdf-editor/api/v1/info/status | grep -q 'UP'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  gateway:
    image: caddy:2.8-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      DASHBOARD_DOMAIN: "${DASHBOARD_DOMAIN:?Set DASHBOARD_DOMAIN in .env.production}"
    volumes:
      - ./config/stirling/Caddyfile.production:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_started
      stirling-pdf:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: "${POSTGRES_DB:?Set POSTGRES_DB in .env.production}"
      POSTGRES_USER: "${POSTGRES_USER:?Set POSTGRES_USER in .env.production}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
  storage_data:
  stirling_config:
  stirling_tessdata:
  caddy_data:
  caddy_config:
