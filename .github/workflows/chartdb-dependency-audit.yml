name: ChartDB Dependency Audit

on:
  pull_request:
    paths:
      - modules/chartdb/package.json
      - modules/chartdb/package-lock.json
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  audit:
    name: Audit ChartDB dependencies
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: modules/chartdb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm audit
